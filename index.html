<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>El Espía - Versión Sorprendente</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1>El Espía</h1>
      <nav class="nav-menu">
        <ul>
          <li data-section="deck" class="active">Mazo Predeterminado</li>
          <li data-section="play">Jugar</li>
        </ul>
      </nav>
    </header>
    <main>
      <section id="deck" class="section active">
        <div class="card-selector">
          <h2>Elige tu Mazo</h2>
          <div class="select-grid">
            <div class="card-option" data-value="paises">Países</div>
            <div class="card-option" data-value="ciudades">Ciudades</div>
            <div class="card-option" data-value="animales">Animales</div>
            <div class="card-option" data-value="frutas">Frutas</div>
            <div class="card-option" data-value="personajesHistoricos">Históricos</div>
            <div class="card-option" data-value="peliculasClasicas">Películas</div>
            <div class="card-option" data-value="deportes">Deportes</div>
            <div class="card-option" data-value="espacio">Espacio</div>
            <div class="card-option" data-value="librosClasicos">Libros</div>
            <div class="card-option" data-value="naturaleza">Naturaleza</div>
            <div class="card-option" data-value="comidas">Comidas</div>
            <div class="card-option" data-value="superheroes">Superhéroes</div>
            <div class="card-option" data-value="musica">Música</div>
            <div class="card-option" data-value="tecnologia">Tecnología</div>
            <div class="card-option" data-value="profesiones">Profesiones</div>
          </div>
        </div>
      </section>

      <section id="play" class="section">
        <h2>¡A Jugar!</h2>
        <div class="player-setup">
          <label for="numPlayersInput">Número de Jugadores:</label>
          <input type="number" id="numPlayersInput" min="3" value="3">
          <button id="startGameBtn" class="action-btn">Empezar Juego</button>
        </div>
        <div id="playerCards" class="game-area">
          <div id="currentCard" class="game-card"></div>
          <button id="nextCardBtn" class="action-btn">Siguiente Carta</button>
        </div>
      </section>
    </main>
  </div>
  <script src="./function.js" defer></script>
</body>
</html>
